<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="emailGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e9ecef;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dee2e6;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="carGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#40c057;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#37b24d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2f9e44;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="carShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#198751;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f5132;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="windowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#87ceeb;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#4682b4;stop-opacity:0.7" />
    </linearGradient>
    
    <radialGradient id="wheelGradient" cx="50%" cy="30%">
      <stop offset="0%" style="stop-color:#6c757d;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#495057;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#212529;stop-opacity:1" />
    </radialGradient>
    
    <!-- 阴影滤镜 -->
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    
    <filter id="emailShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- 邮件信封底层 -->
  <g filter="url(#emailShadow)">
    <!-- 信封主体 -->
    <rect x="8" y="25" width="48" height="32" rx="3" fill="url(#emailGradient)" stroke="#adb5bd" stroke-width="1"/>
    
    <!-- 信封顶部折痕 -->
    <path d="M8 28 L32 45 L56 28" fill="none" stroke="#6c757d" stroke-width="1.5" opacity="0.6"/>
    
    <!-- 信封边缘装饰 -->
    <rect x="8" y="25" width="48" height="32" rx="3" fill="none" stroke="#495057" stroke-width="0.5" opacity="0.3"/>
    
    <!-- 邮票区域 -->
    <rect x="44" y="29" width="10" height="8" rx="1" fill="#dc3545" opacity="0.8"/>
    <rect x="45" y="30" width="8" height="6" rx="0.5" fill="#fff" opacity="0.9"/>
    
    <!-- 信封装饰线条 -->
    <line x1="12" y1="45" x2="28" y2="45" stroke="#6c757d" stroke-width="1" opacity="0.4"/>
    <line x1="12" y1="48" x2="35" y2="48" stroke="#6c757d" stroke-width="1" opacity="0.4"/>
    <line x1="12" y1="51" x2="25" y2="51" stroke="#6c757d" stroke-width="1" opacity="0.4"/>
  </g>
  
  <!-- 绿色小车 -->
  <g filter="url(#dropShadow)">
    <!-- 车身阴影层 -->
    <ellipse cx="34" cy="38" rx="12" ry="3" fill="url(#carShadow)" opacity="0.6"/>
    
    <!-- 车身主体 -->
    <rect x="24" y="20" width="20" height="12" rx="3" fill="url(#carGradient)"/>
    
    <!-- 车顶 -->
    <path d="M26 20 Q32 16 38 20 L42 20 Q42 18 40 18 L28 18 Q26 18 26 20" fill="url(#carGradient)"/>
    
    <!-- 车身装饰条 -->
    <rect x="24" y="24" width="20" height="1.5" rx="0.5" fill="#2f9e44" opacity="0.7"/>
    <rect x="24" y="29" width="20" height="1" rx="0.5" fill="#198751" opacity="0.5"/>
    
    <!-- 车窗 -->
    <rect x="26" y="18.5" width="6" height="6" rx="1.5" fill="url(#windowGradient)"/>
    <rect x="34" y="18.5" width="6" height="6" rx="1.5" fill="url(#windowGradient)"/>
    
    <!-- 车窗装饰 -->
    <rect x="26" y="18.5" width="6" height="1" rx="0.5" fill="#4682b4" opacity="0.3"/>
    <rect x="34" y="18.5" width="6" height="1" rx="0.5" fill="#4682b4" opacity="0.3"/>
    
    <!-- 车灯 -->
    <circle cx="24.5" cy="26" r="1.5" fill="#ffc107" opacity="0.9"/>
    <circle cx="43.5" cy="26" r="1.5" fill="#dc3545" opacity="0.8"/>
    
    <!-- 车轮 -->
    <circle cx="28" cy="33" r="3.5" fill="url(#wheelGradient)"/>
    <circle cx="40" cy="33" r="3.5" fill="url(#wheelGradient)"/>
    
    <!-- 轮毂 -->
    <circle cx="28" cy="33" r="2" fill="#adb5bd"/>
    <circle cx="40" cy="33" r="2" fill="#adb5bd"/>
    <circle cx="28" cy="33" r="1" fill="#6c757d"/>
    <circle cx="40" cy="33" r="1" fill="#6c757d"/>
    
    <!-- 车门把手 -->
    <rect x="30" y="25" width="2" height="1" rx="0.5" fill="#198751"/>
    <rect x="36" y="25" width="2" height="1" rx="0.5" fill="#198751"/>
    
    <!-- 车身高光 -->
    <path d="M25 21 Q34 17 43 21" fill="none" stroke="#51cf66" stroke-width="1" opacity="0.6"/>
  </g>
  
  <!-- 动态效果：轮子旋转线条 -->
  <g opacity="0.4">
    <path d="M26 33 L30 33" stroke="#495057" stroke-width="0.5"/>
    <path d="M28 31 L28 35" stroke="#495057" stroke-width="0.5"/>
    <path d="M38 33 L42 33" stroke="#495057" stroke-width="0.5"/>
    <path d="M40 31 L40 35" stroke="#495057" stroke-width="0.5"/>
  </g>
  
  <!-- 速度线条效果 -->
  <g opacity="0.3">
    <path d="M15 22 L20 22" stroke="#37b24d" stroke-width="1" stroke-linecap="round"/>
    <path d="M16 25 L21 25" stroke="#37b24d" stroke-width="1" stroke-linecap="round"/>
    <path d="M14 28 L19 28" stroke="#37b24d" stroke-width="1" stroke-linecap="round"/>
  </g>
  
  <!-- 邮件飞行轨迹点 -->
  <g opacity="0.6">
    <circle cx="48" cy="15" r="1" fill="#28a745"/>
    <circle cx="52" cy="12" r="0.8" fill="#28a745"/>
    <circle cx="56" cy="10" r="0.6" fill="#28a745"/>
  </g>
</svg>
